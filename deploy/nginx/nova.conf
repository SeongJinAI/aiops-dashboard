# Nova 운영 reverse proxy.
#
# 라우팅:
#   /api/   → backend:8000  (FastAPI — X-Forwarded-* 헤더로 public_url 인식)
#   /ws/    → backend:8000  (WebSocket — Upgrade/Connection 헤더)
#   /       → frontend:80   (SPA 정적 파일, frontend 컨테이너 내부 nginx가 서빙)
#
# SSL: 도메인 보유 시 HTTPS 블록 활성화 + certbot으로 인증서 발급
# (host에서 `certbot certonly --webroot -w ./deploy/certbot -d your-domain.com`)

# upstream block — backend가 살아있지 않을 때도 nginx가 죽지 않게
upstream nova_backend {
    server backend:8000;
    keepalive 16;
}

upstream nova_frontend {
    server frontend:80;
    keepalive 16;
}

# HTTP — 운영에서는 443으로 redirect, dev/스테이징은 직접 서빙
server {
    listen 80 default_server;
    server_name _;

    # ACME (Let's Encrypt) HTTP-01 challenge 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ↓ 도메인이 있고 HTTPS 활성화 시 아래 한 줄 주석 해제, 본 라우팅 블록은 443으로 옮긴다.
    # return 301 https://$host$request_uri;

    # ─── API ────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://nova_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 300s;

        # install.sh는 큰 응답이 될 수 있어 버퍼링 끔
        proxy_buffering off;
    }

    # ─── WebSocket ─────────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://nova_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── SPA (frontend 컨테이너) ────────────────────────────────────────────
    location / {
        proxy_pass        http://nova_frontend;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
    }

    # ─── 압축 & 보안 헤더 ──────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # HSTS는 HTTPS 활성화 후에만 켜기:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;
}

# ─── HTTPS (도메인 + certbot 인증서 발급 후 활성화) ─────────────────────────
