<!-- @dsCard group="Colors" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .dot { width: 10px; height: 10px; border-radius: var(--r-full); flex-shrink: 0; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    border-radius: var(--r-sm);
    font-size: 11px;
    font-weight: 500;
  }
  .name { font-size: 12px; font-weight: 600; width: 80px; }
  .desc { font-size: 11px; color: var(--text-dim); flex: 1; }
  .sample { display: flex; gap: 6px; align-items: center; }
  .swatch {
    width: 36px; height: 22px;
    border-radius: var(--r-sm);
  }
</style>
</head>
<body>
<div class="card">
  <div class="stack">
    <div class="row">
      <div class="name">success</div>
      <div class="sample">
        <div class="swatch" style="background: var(--success);"></div>
        <span class="pill" style="background: var(--success-soft); color: var(--success);">running</span>
      </div>
      <div class="desc">정상 동작, 빌드 성공, hook OK</div>
    </div>
    <div class="row">
      <div class="name">warning</div>
      <div class="sample">
        <div class="swatch" style="background: var(--warning);"></div>
        <span class="pill" style="background: var(--warning-soft); color: var(--warning);">retry</span>
      </div>
      <div class="desc">부분 실패, 재시도, 만료 임박</div>
    </div>
    <div class="row">
      <div class="name">danger</div>
      <div class="sample">
        <div class="swatch" style="background: var(--danger);"></div>
        <span class="pill" style="background: var(--danger-soft); color: var(--danger);">failed</span>
      </div>
      <div class="desc">에러, 인증 실패, 빌드 실패</div>
    </div>
    <div class="row">
      <div class="name">info</div>
      <div class="sample">
        <div class="swatch" style="background: var(--info);"></div>
        <span class="pill" style="background: var(--info-soft); color: var(--info);">queued</span>
      </div>
      <div class="desc">정보, 보조 알림, queued</div>
    </div>
  </div>
</div>
</body>
</html>
