<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
  .card { display: flex; flex-direction: column; gap: 14px; }

  .bar-frame { display: flex; flex-direction: column; gap: 6px; }
  .bar-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; color: var(--text-dim);
  }
  .bar-top .stage { color: var(--text); font-weight: 600; }
  .bar-track {
    height: 6px;
    background: var(--surface-alt);
    border-radius: var(--r-full);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: var(--r-full);
    transition: width 400ms ease-out;
  }
  .bar-fill.warn { background: var(--warning); }
  .bar-fill.fail { background: var(--danger); }

  .stages {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    font-size: 10px;
    color: var(--text-faint);
  }
  .stages .stg {
    display: flex; align-items: center; gap: 4px;
    text-transform: lowercase;
    font-variant-numeric: tabular-nums;
  }
  .stages .stg .ico {
    width: 8px; height: 8px; border-radius: var(--r-full);
    background: var(--border);
    flex-shrink: 0;
  }
  .stages .stg.done { color: var(--text-dim); }
  .stages .stg.done .ico { background: var(--success); }
  .stages .stg.active { color: var(--text); font-weight: 600; }
  .stages .stg.active .ico {
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
</style>
</head>
<body>
<div class="card">

  <div class="bar-frame">
    <div class="bar-top">
      <span><span class="stage">developer perspective</span> 작성 중…</span>
      <span class="t-mono">62% · 14s</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width: 62%;"></div></div>
    <div class="stages">
      <div class="stg done"><span class="ico"></span>catalog</div>
      <div class="stg done"><span class="ico"></span>planner</div>
      <div class="stg active"><span class="ico"></span>developer</div>
      <div class="stg"><span class="ico"></span>user</div>
      <div class="stg"><span class="ico"></span>complete</div>
    </div>
  </div>

  <div class="bar-frame">
    <div class="bar-top">
      <span><span class="stage">완료</span> — 위키 v3 자동 저장됨</span>
      <span class="t-mono">100% · 1m 12s</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width: 100%; background: var(--success);"></div></div>
  </div>

  <div class="bar-frame">
    <div class="bar-top">
      <span><span class="stage" style="color: var(--warning);">retrying</span> — provider timeout, 2/3회 시도</span>
      <span class="t-mono">38%</span>
    </div>
    <div class="bar-track"><div class="bar-fill warn" style="width: 38%;"></div></div>
  </div>

</div>
</body>
</html>
