<!-- @dsCard group="Brand" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
  body { background: var(--bg); }
  .card {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    padding: 14px;
  }
  .frame {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 18px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    min-height: 130px; justify-content: center;
  }
  .frame.dark {
    background: oklch(0.145 0 0);
    border-color: oklch(0.27 0 0);
  }
  .frame img.mark { width: 44px; height: 44px; }
  .frame img.wm   { height: 28px; width: auto; }
  .frame .lab {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
  }
  .frame.dark .lab { color: oklch(0.7 0 0); }
  .tagline {
    grid-column: 1 / -1;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    padding: 6px 0 0;
    line-height: 1.5;
  }
  .tagline strong { color: var(--text); }
</style>
</head>
<body>
<div class="card">
  <div class="frame">
    <img class="mark" src="../assets/logo-mark.svg" alt=""/>
    <div class="lab">MARK · 32px</div>
  </div>
  <div class="frame">
    <img class="wm" src="../assets/logo-wordmark.svg" alt=""/>
    <div class="lab">WORDMARK</div>
  </div>
  <div class="frame dark">
    <img class="wm" style="filter: invert(1) hue-rotate(180deg);" src="../assets/logo-wordmark.svg" alt=""/>
    <div class="lab">ON DARK</div>
  </div>
  <div class="tagline">
    <strong>Nova</strong> — 당신의 AI 협업 흔적으로 만들어진 개인 AGI 파트너.
    <br/>working name · 변경 가능
  </div>
</div>
</body>
</html>
