<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
  body { background: var(--bg); }
  .card { padding: 18px; }
  .scrim {
    background: rgba(0,0,0,0.10);
    padding: 14px;
    border-radius: var(--r-md);
  }
  .palette {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    max-width: 460px;
    margin: 0 auto;
  }
  .palette .top {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--divider);
  }
  .palette .top svg { width: 14px; height: 14px; color: var(--text-faint); }
  .palette .top input {
    flex: 1;
    border: 0; outline: 0;
    background: transparent;
    font-size: 13px;
    color: var(--text);
  }
  .palette .top input::placeholder { color: var(--text-faint); }
  .esc {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    background: var(--surface-alt);
    padding: 1px 5px;
    border-radius: var(--r-sm);
  }
  .group { padding: 4px 0; }
  .ghdr {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    padding: 6px 12px 4px;
  }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 12px;
    font-size: 12px;
  }
  .row.active {
    background: var(--accent-soft);
    color: var(--accent-soft-fg);
  }
  .row .ico { width: 14px; height: 14px; color: var(--text-dim); flex-shrink: 0; }
  .row.active .ico { color: var(--accent-soft-fg); }
  .row .name { flex: 1; }
  .row .keys {
    font-family: var(--font-mono); font-size: 10px; color: var(--text-faint);
  }
</style>
</head>
<body>
<div class="card">
  <div class="scrim">
    <div class="palette">
      <div class="top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input placeholder="명령, 페이지, 프롬프트 검색…" value="prompt" />
        <span class="esc">Esc</span>
      </div>
      <div class="group">
        <div class="ghdr">페이지</div>
        <div class="row active">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="name">프롬프트 — 일별 차트, 시간대 히트맵</span>
          <span class="keys">G · P</span>
        </div>
        <div class="row">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
          <span class="name">에이전트 — Nova 위키 빌드</span>
          <span class="keys">G · A</span>
        </div>
      </div>
      <div class="group" style="border-top: 1px solid var(--divider);">
        <div class="ghdr">액션</div>
        <div class="row">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <span class="name">다크 모드 토글</span>
          <span class="keys">⌘ D</span>
        </div>
        <div class="row">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
          <span class="name">사이드바 접기</span>
          <span class="keys">⌘ B</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
