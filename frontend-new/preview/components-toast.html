<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
  .card { display: flex; flex-direction: column; gap: 8px; }
  .toast {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-md);
    max-width: 380px;
    margin-left: auto; /* stacks bottom-right */
  }
  .toast .ico {
    width: 14px; height: 14px;
    flex-shrink: 0;
  }
  .toast .title { font-size: 12px; font-weight: 500; color: var(--text); flex: 1; }
  .toast .x {
    background: transparent; border: 0; cursor: pointer;
    color: var(--text-faint);
    padding: 2px;
    display: inline-flex;
  }
  .toast .x:hover { color: var(--text); }
  .toast .x svg { width: 12px; height: 12px; }

  .toast.success .ico { color: var(--success); }
  .toast.danger  .ico { color: var(--danger); }
  .toast.info    .ico { color: var(--info); }
</style>
</head>
<body>
<div class="card">

  <div class="toast success">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
    <div class="title">API 키가 안전하게 저장되었습니다.</div>
    <button class="x" aria-label="close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="toast danger">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>
    <div class="title">Nova 빌드 실패 — 다시 시도하세요.</div>
    <button class="x" aria-label="close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="toast info">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <div class="title">레포 ‘kepler’가 분리되었습니다.</div>
    <button class="x" aria-label="close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

</div>
</body>
</html>
