<!-- @dsCard group="Spacing" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
  body { background: var(--bg); }
  .card { padding: 28px 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .item { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .demo {
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
  }
  .demo.sm { box-shadow: var(--shadow-sm); }
  .demo.md { box-shadow: var(--shadow-md); }
  .demo.lg { box-shadow: var(--shadow-lg); }
  .name { font-size: 11px; font-weight: 600; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="item">
    <div class="demo"></div>
    <div class="name">--shadow-none</div>
    <div class="meta">cards at rest</div>
  </div>
  <div class="item">
    <div class="demo sm"></div>
    <div class="name">--shadow-sm</div>
    <div class="meta">card hover</div>
  </div>
  <div class="item">
    <div class="demo md"></div>
    <div class="name">--shadow-md</div>
    <div class="meta">popover, dropdown</div>
  </div>
  <div class="item">
    <div class="demo lg"></div>
    <div class="name">--shadow-lg</div>
    <div class="meta">modal, palette</div>
  </div>
</div>
</body>
</html>
