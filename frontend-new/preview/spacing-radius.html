<!-- @dsCard group="Spacing" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
  .card { display: flex; gap: 14px; }
  .item { flex: 1; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .demo {
    width: 100%;
    aspect-ratio: 5/3;
    background: var(--surface-alt);
    border: 1px solid var(--border);
  }
  .demo.sm { border-radius: var(--r-sm); }
  .demo.md { border-radius: var(--r-md); }
  .demo.lg { border-radius: var(--r-lg); }
  .demo.full { border-radius: var(--r-full); aspect-ratio: 1/1; width: 60%; }
  .name { font-size: 12px; font-weight: 600; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
  .use { font-size: 10.5px; color: var(--text-dim); text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="item">
    <div class="demo sm"></div>
    <div class="name">--r-sm</div>
    <div class="meta">4px</div>
    <div class="use">chips, badges, kbd</div>
  </div>
  <div class="item">
    <div class="demo md"></div>
    <div class="name">--r-md</div>
    <div class="meta">6px · default</div>
    <div class="use">cards, buttons, inputs</div>
  </div>
  <div class="item">
    <div class="demo lg"></div>
    <div class="name">--r-lg</div>
    <div class="meta">8px</div>
    <div class="use">modals, large cards</div>
  </div>
  <div class="item">
    <div class="demo full"></div>
    <div class="name">--r-full</div>
    <div class="meta">9999px</div>
    <div class="use">avatars, dots only</div>
  </div>
</div>
</body>
</html>
