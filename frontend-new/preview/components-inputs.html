<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
  .card { display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .lab { font-size: 11px; color: var(--text-dim); }

  .input, .select {
    height: 28px;
    padding: 0 10px;
    border-radius: var(--r-md);
    border: 1px solid var(--border);
    background: var(--surface);
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--text);
    outline: none;
    transition: border-color 120ms ease-out, box-shadow 120ms ease-out;
  }
  .input:focus, .select:focus { border-color: var(--border-active); box-shadow: 0 0 0 3px var(--ring); }
  .input::placeholder { color: var(--text-faint); }
  .input.mono { font-family: var(--font-mono); font-size: 11.5px; }

  .input-wrap { position: relative; }
  .input-wrap .ico {
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px;
    color: var(--text-faint);
  }
  .input-wrap .input { padding-left: 28px; }

  .input.error { border-color: var(--danger); }
  .help { font-size: 10.5px; color: var(--text-dim); }
  .help.error { color: var(--danger); }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="field">
      <div class="lab">레포 별칭</div>
      <input class="input" value="nova" />
    </div>
    <div class="field">
      <div class="lab">검색</div>
      <div class="input-wrap">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="input" placeholder="prompts, hooks, files…" />
      </div>
    </div>
  </div>

  <div class="row">
    <div class="field">
      <div class="lab">Anthropic API Key (BYOK)</div>
      <input class="input mono" type="password" value="sk-ant-1abcdefghij***xyz9" />
      <div class="help">평문은 저장되지 않습니다. AES‑GCM 암호화 후 마스킹 표시.</div>
    </div>
    <div class="field">
      <div class="lab">Provider</div>
      <select class="select">
        <option>Anthropic</option>
        <option>OpenAI</option>
        <option>Google Gemini</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="field">
      <div class="lab">모델 이름 <span style="color: var(--text-faint); font-weight: 400;">(선택)</span></div>
      <input class="input mono" placeholder="claude-haiku-4-5" />
      <div class="help">비워두면 provider 기본 모델을 사용합니다.</div>
    </div>
    <div class="field">
      <div class="lab">잘못된 키 (error state)</div>
      <input class="input mono error" type="password" value="sk-...invalid" />
      <div class="help error">키 검증 실패 — 권한을 확인해 주세요.</div>
    </div>
  </div>
</div>
</body>
</html>
