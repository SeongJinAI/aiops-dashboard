<!-- @dsCard group="Colors" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
  body { background: var(--bg); }
  .card { background: var(--bg); }
  .frame {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 14px 16px;
  }
  .row { display: flex; gap: 10px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .stat-row { display: flex; gap: 12px; }
  .stat {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    border-radius: var(--r-md);
    padding: 8px 10px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat .num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .lab { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .delta { font-size: 10px; font-family: var(--font-mono); }
  .stat .delta.up { color: var(--success); }
  .stat .delta.dn { color: var(--danger); }
  .dot { width: 8px; height: 8px; border-radius: var(--r-full); }
  .heading {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="frame">
    <div class="heading">DARK MODE · zinc-950 background</div>
    <div class="stat-row">
      <div class="stat">
        <div class="lab">prompts 24h</div>
        <div class="num">3,124</div>
        <div class="delta up">+12%</div>
      </div>
      <div class="stat">
        <div class="lab">hooks</div>
        <div class="num">847</div>
        <div class="delta up">+4%</div>
      </div>
      <div class="stat">
        <div class="lab">misunderstand</div>
        <div class="num">12</div>
        <div class="delta dn">−18%</div>
      </div>
      <div class="stat">
        <div class="lab">health</div>
        <div class="num" style="display:flex;align-items:center;gap:6px;"><span class="dot" style="background: var(--success);"></span>OK</div>
        <div class="delta" style="color: var(--text-dim);">3 services</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
