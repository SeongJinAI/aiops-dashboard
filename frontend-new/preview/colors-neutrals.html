<!-- @dsCard group="Colors" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .item { display: flex; flex-direction: column; gap: 6px; }
  .sw { height: 56px; border-radius: var(--r-md); border: 1px solid var(--border); }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="item">
      <div class="sw" style="background: var(--bg);"></div>
      <div class="name">bg</div>
      <div class="label-mono">oklch(0.985 0 0)</div>
    </div>
    <div class="item">
      <div class="sw" style="background: var(--surface);"></div>
      <div class="name">surface</div>
      <div class="label-mono">oklch(1 0 0)</div>
    </div>
    <div class="item">
      <div class="sw" style="background: var(--surface-alt);"></div>
      <div class="name">surface-alt</div>
      <div class="label-mono">oklch(0.96 0 0)</div>
    </div>
    <div class="item">
      <div class="sw" style="background: var(--border);"></div>
      <div class="name">border</div>
      <div class="label-mono">oklch(0.92 0 0)</div>
    </div>
    <div class="item">
      <div class="sw" style="background: var(--text-dim);"></div>
      <div class="name">text-dim</div>
      <div class="label-mono">oklch(0.55 0 0)</div>
    </div>
    <div class="item">
      <div class="sw" style="background: var(--text);"></div>
      <div class="name">text</div>
      <div class="label-mono">oklch(0.205 0 0)</div>
    </div>
  </div>
</div>
</body>
</html>
