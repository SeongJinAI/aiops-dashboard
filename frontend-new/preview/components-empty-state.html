<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
  .card {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--r-md);
    padding: 24px 20px;
    display: flex; align-items: center; gap: 18px;
  }
  .icon-frame {
    width: 44px; height: 44px;
    border-radius: var(--r-md);
    background: var(--accent-soft);
    color: var(--accent-soft-fg);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icon-frame svg { width: 22px; height: 22px; }
  .body { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .title { font-size: 13px; font-weight: 600; color: var(--text); }
  .desc { font-size: 11.5px; color: var(--text-dim); line-height: 1.5; }
  .actions { display: flex; gap: 6px; margin-top: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    height: 24px; padding: 0 9px;
    font-size: 11px; font-weight: 500;
    border-radius: var(--r-md);
    border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    cursor: pointer;
  }
  .btn.primary {
    background: var(--accent); color: white; border-color: transparent;
  }
  .btn svg { width: 12px; height: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon-frame">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
  </div>
  <div class="body">
    <div class="title">Hook 활동이 아직 없습니다</div>
    <div class="desc">Claude Code, Cursor, Windsurf 어디서든 첫 세션이 시작되면 자동으로 기록됩니다. 한 번도 실행한 적이 없다면 설치 가이드를 확인하세요.</div>
    <div class="actions">
      <button class="btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        Hook 설치 가이드 보기
      </button>
      <button class="btn">샘플 데이터로 미리보기</button>
    </div>
  </div>
</div>
</body>
</html>
